version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cfos-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-cfos_db}
    ports:
      - "5433:5432"
    volumes:
      - cfos_postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: cfos-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@cfos.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  cfos_postgres_data:
